<div class="container my-4">
  <div class="card shadow-sm">
    <div class="card-header bg-dark text-white">
      <h4 class="mb-0"><i class="fas fa-file-invoice me-2"></i> Registrar Nueva Factura</h4>
    </div>

    <div class="card-body">
      <!-- Formulario principal -->
      <form (ngSubmit)="guardarFactura()">

        <!-- SECCIÓN 1: Datos Generales -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="numeroFactura" class="form-label">Número de Factura</label>
            <input type="text" class="form-control"
            [(ngModel)]="factura.numero"  name="numerofactura"
            maxlength="8"
            id="numeroFactura" placeholder="Ej: F001-002" required>
          </div>
          <div class="col-md-6">
            <label for="fechaEmision" class="form-label">Fecha de Emisión</label>
            <input type="date" class="form-control" id="fechaEmision"
            [(ngModel)]="factura.fecha"
             name="fechafactura"
            required>
          </div>
        </div>

        <div class="row mb-4">
          <!-- Datos del Cliente -->
          <div class="col-md-6">
            <div class="p-3 border rounded bg-light">
              <h5 class="text-primary mb-3"><i class="fas fa-user me-1"></i> Datos del Cliente</h5>
              <div class="mb-2">
                <label class="form-label">Nombre / Razón Social</label>
                <input type="text"
                class="form-control"
                placeholder="Nombre del cliente"
                [(ngModel)]="factura.cliente.nombre"
                name="Nombrecliente"
                required>
              </div>
              <div class="mb-2">
                <label class="form-label">Ubicación</label>
                <input type="text" class="form-control"
                name="ubicacionCliente"
                [(ngModel)]="factura.cliente.ubicacion"
                 placeholder="Ciudad / País">
              </div>
              <div>
                <label class="form-label">Dirección</label>
                <input type="text" class="form-control"
                name="direccionCliente"
                [(ngModel)]="factura.cliente.direccion"
                placeholder="Dirección fiscal">
              </div>
            </div>
          </div>

          <!-- Datos de la Empresa -->
          <div class="col-md-6">
            <div class="p-3 border rounded bg-light">
              <h5 class="text-secondary mb-3"><i class="fas fa-building me-1"></i> Datos de la Empresa</h5>
              <div class="mb-2">
                <label class="form-label">Nombre de la Empresa</label>
                <input type="text" class="form-control"
                name="nombreEmpresa"
                [(ngModel)]="factura.empresa.nombre"
                maxlength="100"
                placeholder="Tu empresa S.A.C." required>
              </div>
              <div class="mb-2">
                <label class="form-label">RUC / Identificación Fiscal</label>
                <input type="text" class="form-control"
                name="rucEmpresa"
                [(ngModel)]="factura.empresa.ruc"
                 maxlength="20"
                 placeholder="20XXXXXXXXX">
              </div>
            </div>
          </div>
        </div>

        <!-- SECCIÓN 2: Detalle de la Factura (Productos / Ítems) -->
        <hr class="my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5><i class="fas fa-boxes me-1"></i> Detalle de Productos</h5>
          <!-- Botón para agregar más filas de productos -->
          <button type="button" class="btn btn-outline-primary btn-sm" (click)="agregarItem()">
            <i class="fas fa-plus me-1"></i> Agregar Ítem
          </button>
        </div>

        <div class="table-responsive">
          <table class="table table-bordered align-middle">
            <thead class="table-dark">
              <tr>
                <th style="width: 5%;">Id</th>
                <th style="width: 45%;">Producto</th>
                <th style="width: 20%;">Precio (S/.)</th>
                <th style="width: 15%;">Cantidad</th>
                <th style="width: 15%;" class="text-center">Acciones</th>
              </tr>
            </thead>
           <tbody>
  @for (item of items; track item.id; let i = $index) {
    <tr>
      <td>{{ item.id }}</td>
      <td>
        <input type="text" class="form-control form-control-sm" [(ngModel)]="item.producto" [name]="'producto' + i" required>
      </td>
      <td>
        <input type="number" class="form-control form-control-sm" [(ngModel)]="item.precio" [name]="'precio' + i" required>
      </td>
      <td>
        <input type="number" class="form-control form-control-sm" [(ngModel)]="item.cantidad" [name]="'cantidad' + i" required>
      </td>
      <td class="text-center">
        <button type="button" class="btn btn-danger btn-sm" (click)="eliminarItem(i)">
          <i class="fas fa-trash-alt"></i>
        </button>
      </td>
    </tr>
  }
</tbody>
          </table>
        </div>

        <!-- SECCIÓN 3: Totales y Botón de Guardar -->
        <div class="row justify-content-end mt-4">
          <div class="col-md-4">
            <div class="p-3 border bg-light rounded text-end">
              <h4 class="mb-3 text-success">Total: S/. {{ calcularTotal() | number:'1.2-2' }}</h4>
              <button type="submit" class="btn btn-success w-100">
                <i class="fas fa-save me-1"></i> Guardar Factura
              </button>
            </div>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
