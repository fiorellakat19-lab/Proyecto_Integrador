<div class="container mt-5" style="max-width: 400px;">
  <div class="card shadow">
    <div class="card-body">
      <h3 class="text-center mb-4"><i class="fas fa-lock"></i> Iniciar Sesión</h3>

      <!-- 1. Agregamos (ngSubmit) aquí -->
      <form (ngSubmit)="iniciarSesion()">
        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control"
           placeholder="correo@ejemplo.com"
           name="email"
           [(ngModel)]="loginData.email">
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password"
          class="form-control"
           placeholder="********"
           name="password"
           [(ngModel)]="loginData.password">
        </div>

        <!-- 2. Quitamos el (click) del botón y lo dejamos como type="submit" -->
        <button type="submit" class="btn btn-primary w-100">
          <i class="fas fa-sign-in-alt me-1"></i> Entrar
        </button>
      </form>

      <!-- Mensaje de error condicional con la nueva sintaxis @if -->
      @if (errorMessage) {
        <div class="alert alert-danger py-2 mt-3" role="alert">
          {{ errorMessage }}
        </div>
      }
    </div>
  </div>
</div>
